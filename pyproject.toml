[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-zen-rotator"
version = "0.1.0"
description = "Local route switching for OpenCode Zen free models"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.28.1,<0.29"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8"]

[project.scripts]
zen-rate-gateway = "zen_rotator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["zen_rotator"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
